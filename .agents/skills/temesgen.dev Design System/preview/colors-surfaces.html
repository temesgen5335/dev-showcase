<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-sans);}
.card{padding:20px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.swatch{display:flex;flex-direction:column;gap:8px;}
.chip{height:64px;border-radius:8px;border:1px solid var(--color-border);}
.label{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:-.01em;line-height:1.35;}
.label b{display:block;color:var(--fg-1);font-weight:500;font-size:12px;margin-bottom:2px;}
</style></head>
<body class="tg-html"><div class="card">
  <div class="swatch"><div class="chip" style="background:#0a0a0a"></div><div class="label"><b>bg</b>#0a0a0a</div></div>
  <div class="swatch"><div class="chip" style="background:#111111"></div><div class="label"><b>surface</b>#111111</div></div>
  <div class="swatch"><div class="chip" style="background:#171717"></div><div class="label"><b>surface-2</b>#171717</div></div>
  <div class="swatch"><div class="chip" style="background:#262626"></div><div class="label"><b>border</b>#262626</div></div>
  <div class="swatch"><div class="chip" style="background:#404040"></div><div class="label"><b>border-hov</b>#404040</div></div>
</div></body></html>
