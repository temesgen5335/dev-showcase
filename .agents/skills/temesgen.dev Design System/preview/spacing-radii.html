<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Spacing — Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-mono);}
.card{padding:22px 28px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.s{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box{width:46px;height:46px;background:var(--color-surface);border:1px solid var(--color-border);}
.l{font-size:10px;color:var(--fg-3);text-align:center;line-height:1.3;}
.l b{display:block;color:var(--fg-1);font-weight:500;font-size:11px;}
</style></head>
<body class="tg-html"><div class="card">
  <div class="s"><div class="box" style="border-radius:4px"></div><div class="l"><b>4</b>tag</div></div>
  <div class="s"><div class="box" style="border-radius:5.6px"></div><div class="l"><b>5.6</b>input</div></div>
  <div class="s"><div class="box" style="border-radius:6px"></div><div class="l"><b>6</b>btn</div></div>
  <div class="s"><div class="box" style="border-radius:6.4px"></div><div class="l"><b>6.4</b>cover</div></div>
  <div class="s"><div class="box" style="border-radius:8px"></div><div class="l"><b>8</b>card</div></div>
  <div class="s"><div class="box" style="border-radius:9.6px"></div><div class="l"><b>9.6</b>panel</div></div>
  <div class="s"><div class="box" style="border-radius:999px"></div><div class="l"><b>pill</b>fab</div></div>
</div></body></html>
