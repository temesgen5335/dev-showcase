<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Components — Nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-sans);}
.frame{padding:18px;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14.4px 24px;backdrop-filter:blur(10px);background:rgba(10,10,10,.7);border-bottom:1px solid var(--color-border);border-top:1px solid var(--color-border);}
.brand{font-family:var(--font-mono);font-size:15.2px;color:var(--fg-1);letter-spacing:-.02em;font-weight:500;}
.links{display:flex;gap:17.6px;font-family:var(--font-mono);font-size:13.1px;}
.links a{color:var(--fg-3);text-decoration:none;}
.links a.active{color:var(--fg-1);}
.spec{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);padding:0 24px 8px;}
</style></head>
<body class="tg-html"><div class="frame">
  <div class="spec">// sticky · backdrop-filter blur(10px) · only place transparency is used in the system</div>
  <div class="nav">
    <div class="brand">temesgen.dev</div>
    <div class="links"><a class="active">experience</a><a>projects</a><a>about</a><a>blog</a><a>contact</a></div>
  </div>
</div></body></html>
