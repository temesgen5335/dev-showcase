<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Brand — Avatar & OG</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-mono);}
.card{padding:18px 24px;display:flex;align-items:center;gap:20px;}
.img{width:96px;height:96px;border-radius:8px;border:1px solid var(--color-border);overflow:hidden;flex-shrink:0;}
.img img{width:100%;height:100%;object-fit:cover;display:block;}
.meta{font-size:11.5px;line-height:1.55;color:var(--fg-3);}
.meta b{display:block;color:var(--fg-1);font-size:13px;font-weight:500;letter-spacing:-.02em;margin-bottom:4px;}
.meta span{color:var(--color-accent);}
</style></head>
<body class="tg-html"><div class="card">
  <div class="img"><img src="../assets/avatar.jpg" alt=""></div>
  <div class="meta">
    <b>avatar.jpg</b>
    favicon + OG image only · <span>not</span> rendered into UI surfaces<br>
    site has no logo lockup — wordmark is <span>temesgen.dev</span> set in IBM Plex Mono 500
  </div>
</div></body></html>
