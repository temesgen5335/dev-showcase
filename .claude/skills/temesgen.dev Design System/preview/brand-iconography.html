<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Brand — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-mono);}
.card{padding:18px 24px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.s{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--color-border);border-radius:6px;padding:14px 6px 10px;background:var(--color-surface);}
.g{font-size:28px;color:var(--fg-1);line-height:1;letter-spacing:-.02em;font-weight:500;}
.l{font-size:10px;color:var(--fg-3);text-align:center;line-height:1.3;}
.l b{display:block;color:var(--fg-1);font-weight:500;font-size:11px;}
</style></head>
<body class="tg-html"><div class="card">
  <div class="s"><div class="g">→</div><div class="l"><b>forward</b>view ex. →</div></div>
  <div class="s"><div class="g">↗</div><div class="l"><b>external</b>live ↗</div></div>
  <div class="s"><div class="g">↓</div><div class="l"><b>scroll</b>cue</div></div>
  <div class="s"><div class="g">·</div><div class="l"><b>middot</b>separator</div></div>
  <div class="s"><div class="g">~</div><div class="l"><b>tilde</b>location prefix</div></div>
  <div class="s"><div class="g">//</div><div class="l"><b>slashes</b>section label</div></div>
</div></body></html>
