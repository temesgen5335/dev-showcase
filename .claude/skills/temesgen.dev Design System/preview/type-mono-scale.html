<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Type — Mono Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-mono);}
.card{padding:22px 28px;display:flex;flex-direction:column;gap:10px;}
.row{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:baseline;}
.spec{font-size:10px;color:var(--fg-3);letter-spacing:0;}
.t{color:var(--fg-1);letter-spacing:-.02em;font-weight:500;}
</style></head>
<body class="tg-html"><div class="card">
  <div class="row"><div class="spec">15.2px · h2 card</div><div class="t" style="font-size:15.2px">// featured work</div></div>
  <div class="row"><div class="spec">13.6px · btn label</div><div class="t" style="font-size:13.6px">view experience →</div></div>
  <div class="row"><div class="spec">13.1px · nav link</div><div class="t" style="font-size:13.1px;color:var(--fg-3)">experience &nbsp; projects &nbsp; about &nbsp; blog</div></div>
  <div class="row"><div class="spec">12.5px · meta</div><div class="t" style="font-size:12.5px;color:var(--fg-3);font-weight:400">~ addis ababa, ethiopia · available for senior ai roles</div></div>
  <div class="row"><div class="spec">11.5px · tag chip</div><div class="t" style="font-size:11.5px;color:var(--fg-3);font-weight:400">FastAPI · LangChain · Postgres</div></div>
</div></body></html>
