<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-sans);}
.card{padding:24px 28px;}
.spec{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-bottom:8px;}
.display{font-family:var(--font-sans);font-size:54px;line-height:1.05;letter-spacing:-.02em;color:var(--fg-1);font-weight:500;margin:0;}
.role{font-family:var(--font-mono);font-size:17px;color:var(--fg-2);margin-top:12px;letter-spacing:-.01em;}
.role span{color:var(--fg-3);}
</style></head>
<body class="tg-html"><div class="card">
  <div class="spec">// hero display · Inter 500 · clamp(2rem, 5vw, 3.4rem) · -0.02em · lh 1.05</div>
  <h1 class="display">Temesgen Gebreabzgi.</h1>
  <div class="role">Certified AI Engineer <span>·</span> Building scalable full-stack AI systems</div>
</div></body></html>
