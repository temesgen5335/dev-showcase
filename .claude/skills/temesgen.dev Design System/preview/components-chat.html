<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Components — Chat Widget</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--color-bg);color:var(--fg-2);font-family:var(--font-sans);}
.frame{padding:18px;display:flex;gap:18px;align-items:flex-end;}
.fab{font-family:var(--font-mono);font-size:12.8px;padding:10.4px 15.2px;border-radius:999px;border:1px solid var(--color-border);background:var(--fg-1);color:#000;cursor:pointer;align-self:center;}
.panel{width:280px;height:280px;display:flex;flex-direction:column;border:1px solid var(--color-border);border-radius:9.6px;background:var(--color-surface);overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);}
.h{padding:12px 16px;border-bottom:1px solid var(--color-border);font-family:var(--font-mono);font-size:13.6px;color:var(--fg-1);}
.h em{color:var(--fg-3);font-style:normal;font-size:11.5px;margin-left:8px;}
.body{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.45;overflow:auto;}
.bot{align-self:flex-start;max-width:88%;}
.user{align-self:flex-end;max-width:88%;padding:8px 12px;border-radius:8px;background:var(--color-surface-2);border:1px solid var(--color-border);}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--color-border);}
.compose input{flex:1;padding:7px 10px;border-radius:5.6px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--fg-2);font-size:13px;outline:none;}
.compose button{font-family:var(--font-mono);font-size:12.8px;padding:0 14px;border-radius:5.6px;border:1px solid var(--color-border);background:var(--fg-1);color:#000;}
</style></head>
<body class="tg-html"><div class="frame">
  <button class="fab">ask my portfolio</button>
  <div class="panel">
    <div class="h">ask my portfolio<em>grounded on temesgen's CV</em></div>
    <div class="body">
      <div class="bot">Hi — I'm Temesgen's portfolio assistant. Ask me about his experience, projects, stack, or availability.</div>
      <div class="user">Tell me about Chronos.</div>
    </div>
    <div class="compose"><input placeholder="ask anything about temesgen…"><button>send</button></div>
  </div>
</div></body></html>
